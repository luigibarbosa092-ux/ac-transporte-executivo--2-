<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="blueGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#38C2FF" />
      <stop offset="40%" stop-color="#00A3E0" />
      <stop offset="100%" stop-color="#0066B3" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="250" cy="250" r="235" fill="url(#blueGrad)" filter="url(#shadow)" />
  <circle cx="250" cy="250" r="235" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.4" />
  
  <!-- Car Silhouette Outline -->
  <path d="M 65 270 C 95 240, 160 205, 230 195 C 290 187, 390 220, 435 275 C 410 260, 360 250, 310 250 C 270 250, 160 265, 65 270 Z" fill="#FFFFFF" opacity="0.9" />
  <path d="M 70 290 Q 110 220, 205 190 Q 300 160, 430 255" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" />
  
  <!-- Front Wheel Arch & Rear Wheel Arch -->
  <path d="M 125 290 A 28 28 0 0 1 180 290" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" />
  <path d="M 330 290 A 28 28 0 0 1 385 290" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" />
  
  <!-- Underline divider -->
  <line x1="120" y1="298" x2="380" y2="298" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

  <!-- Bold AC Typography -->
  <g fill="#FFFFFF" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Inter', 'Arial Black', sans-serif">
    <text x="250" y="270" font-size="115" font-weight="900" letter-spacing="-3">AC</text>
    
    <!-- Transporte Executivo text -->
    <text x="250" y="348" font-size="31" font-weight="800" letter-spacing="1.5">Transporte Executivo</text>
  </g>

  <!-- 5 Stars -->
  <g fill="#FFFFFF" transform="translate(162, 365)">
    <!-- Star 1 -->
    <path d="M15,0 L18.5,10.8 L29.9,10.8 L20.7,17.5 L24.2,28.3 L15,21.6 L5.8,28.3 L9.3,17.5 L0.1,10.8 L11.5,10.8 Z" />
    <!-- Star 2 -->
    <path d="M52,0 L55.5,10.8 L66.9,10.8 L57.7,17.5 L61.2,28.3 L52,21.6 L42.8,28.3 L46.3,17.5 L37.1,10.8 L48.5,10.8 Z" />
    <!-- Star 3 -->
    <path d="M89,0 L92.5,10.8 L103.9,10.8 L94.7,17.5 L98.2,28.3 L89,21.6 L79.8,28.3 L83.3,17.5 L74.1,10.8 L85.5,10.8 Z" />
    <!-- Star 4 -->
    <path d="M126,0 L129.5,10.8 L140.9,10.8 L131.7,17.5 L135.2,28.3 L126,21.6 L116.8,28.3 L120.3,17.5 L111.1,10.8 L122.5,10.8 Z" />
    <!-- Star 5 -->
    <path d="M163,0 L166.5,10.8 L177.9,10.8 L168.7,17.5 L172.2,28.3 L163,21.6 L153.8,28.3 L157.3,17.5 L148.1,10.8 L159.5,10.8 Z" />
  </g>
</svg>
